<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <!-- 1. الخلفية الإجمالية والإطار الأزرق الخارجي -->
  <rect x="4" y="4" width="292" height="492" rx="14" ry="14" fill="#0066cc" />
  
  <!-- 2. الجزء الأوسط (خلفية بيضاء لـ 110) -->
  <rect x="10" y="140" width="280" height="170" fill="#ffffff" />
  
  <!-- 3. الجزء الأسفل (خلفية بيضاء لـ 90 والمطر) -->
  <rect x="10" y="316" width="280" height="174" rx="0" ry="0" fill="#ffffff" />
  <!-- تعديل الحواف السفلى البيضاء لتتناسب مع الإطار -->
  <path d="M 10,470 A 10,10 0 0,0 20,486 L 280,486 A 10,10 0 0,0 290,470 L 290,316 L 10,316 Z" fill="#ffffff" />

  <!-- 4. شعار الطريق السيارة في الأعلى (Autoroute) -->
  <g transform="translate(103, 20)">
    <!-- المربع الأبيض الخارجي للشعار -->
    <rect x="0" y="0" width="94" height="104" rx="4" fill="none" stroke="#ffffff" stroke-width="5" />
    
    <!-- خطوط الطريق المتجهة نحو الأفق -->
    <polygon points="18,96 38,12 44,12 36,96" fill="#ffffff" />
    <polygon points="58,96 50,12 56,12 76,96" fill="#ffffff" />
    
    <!-- الممر الفوقي (الجسر) -->
    <path d="M 10,42 L 84,42 L 84,50 L 76,50 L 76,58 L 68,58 L 68,50 L 26,50 L 26,58 L 18,58 L 18,50 L 10,50 Z" fill="#ffffff" />
  </g>

  <!-- 5. علامة تحديد السرعة 110 -->
  <g transform="translate(150, 225)">
    <circle cx="0" cy="0" r="58" fill="#ffffff" stroke="#d32f2f" stroke-width="15" />
    <text x="0" y="14" font-family="'Arial Black', Impact, sans-serif" font-size="40" font-weight="900" text-anchor="middle" fill="#1a1a1a">110</text>
  </g>

  <!-- 6. علامة تحديد السرعة 90 -->
  <g transform="translate(95, 400)">
    <circle cx="0" cy="0" r="52" fill="#ffffff" stroke="#d32f2f" stroke-width="14" />
    <text x="0" y="12" font-family="'Arial Black', Impact, sans-serif" font-size="38" font-weight="900" text-anchor="middle" fill="#1a1a1a">90</text>
  </g>

  <!-- 7. رمز السحابة الأمطار (Cloud and Rain) -->
  <g transform="translate(170, 342)">
    <!-- السحابة -->
    <path d="M 20,40 
             Q 10,40 10,30 
             Q 8,18 22,16 
             Q 28,4 44,8 
             Q 56,2 66,12 
             Q 76,10 78,22 
             Q 88,26 82,38 
             Q 82,40 70,40 Z" 
          fill="#ffffff" stroke="#333333" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- خطوط المطر المائلة -->
    <g stroke="#333333" stroke-width="3" stroke-linecap="round">
      <line x1="22" y1="48" x2="8" y2="78" />
      <line x1="32" y1="48" x2="18" y2="78" />
      <line x1="42" y1="48" x2="28" y2="78" />
      <line x1="52" y1="48" x2="38" y2="78" />
      <line x1="62" y1="48" x2="48" y2="78" />
      <line x1="72" y1="48" x2="58" y2="78" />
    </g>
  </g>
</svg>
