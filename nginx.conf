server {
    listen 80;
    server_name _;
    
    root /var/www/public;
    index index.php index.html;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # 1. Gestion des URLs d'application (Laravel Routing)
    location / {
        try_files \(uri\)uri/ /index.php?$query_string;
        gzip_static on;
    }

    # 2. Service direct des fichiers statiques existants
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|eot|ttf|woff|woff2)$ {
        expires max;
        log_not_found off;
        try_files $uri =404;
    }

    # 3. Execution des scripts PHP via PHP-FPM (Fix File not found)
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        
        # S'assurer que le chemin absolu vers index.php est correct
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
