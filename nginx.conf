server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    root /var/www/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 25M;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # 1. Routage Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2. Fichiers statiques (images, css, js…)
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|eot|ttf|woff|woff2)$ {
        expires 30d;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # 3. Fichiers cachés (.env, .git…) — sécurité
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 4. PHP via PHP-FPM
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTPS           $https if_not_empty;

        # 🔑 Indispensable derrière un proxy (Render, Cloudflare, etc.)
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR   $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_x_forwarded_host;

        # Timeouts pour uploads de photos
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
